<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ScreenFox</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: transparent;
            pointer-events: none;
            user-select: none;
        }

        #pet-container {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            cursor: grab;
            position: relative;
        }

        /* Enable interaction when mouse is over the pet window */
        #pet-container.interactive {
            pointer-events: auto;
        }

        #pet-container:active {
            cursor: grabbing;
        }

        #fox {
            width: 128px;
            height: 128px;
            transition: transform 0.1s ease, filter 0.3s ease;
        }

        /* State-specific styles */
        #pet-container.state-idle #fox {
            /* Subtle breathing */
            animation: pet-idle 3s ease-in-out infinite;
        }

        #pet-container.state-walking #fox {
            filter: saturate(1.2);
        }

        #pet-container.state-sleeping #fox {
            filter: brightness(0.7) saturate(0.5);
            animation: pet-sleep-breathe 3s ease-in-out infinite;
        }

        /* Sleeping: closed eyes overlay */
        #pet-container.state-sleeping .eye-pupil {
            display: none;
        }
        #pet-container.state-sleeping .eye-closed {
            display: inline;
        }

        #pet-container.state-playing #fox {
            filter: saturate(1.4) brightness(1.1);
        }

        /* Animations */
        @keyframes pet-idle {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.02); }
        }

        @keyframes pet-bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }

        @keyframes zzz-float {
            0% { opacity: 0; transform: translateY(0) scale(0.8); }
            50% { opacity: 1; transform: translateY(-12px) scale(1); }
            100% { opacity: 0; transform: translateY(-24px) scale(1.2); }
        }

        @keyframes pet-sleep-breathe {
            0%, 100% { transform: scale(0.95); }
            50% { transform: scale(1.05); }
        }
    </style>
</head>
<body>
    <div id="pet-container">
        <svg id="fox" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
            <!-- Placeholder fox shape — will be replaced by agent CLIs -->
            <circle cx="64" cy="64" r="48" fill="#FF8C00" />
            <!-- Eyes -->
            <circle cx="44" cy="52" r="8" fill="white" class="eye-white" />
            <circle cx="44" cy="52" r="4" fill="black" class="eye-pupil" />
            <path d="M38 52 Q44 48 50 52" stroke="black" stroke-width="2" fill="none" class="eye-closed" style="display:none" />
            <circle cx="84" cy="52" r="8" fill="white" class="eye-white" />
            <circle cx="84" cy="52" r="4" fill="black" class="eye-pupil" />
            <path d="M78 52 Q84 48 90 52" stroke="black" stroke-width="2" fill="none" class="eye-closed" style="display:none" />
            <ellipse cx="64" cy="72" rx="6" ry="4" fill="#333" />
            <!-- Ears -->
            <polygon points="32,32 24,8 48,28" fill="#FF8C00" />
            <polygon points="96,32 104,8 80,28" fill="#FF8C00" />
            <polygon points="34,28 28,14 44,26" fill="#FFB347" />
            <polygon points="94,28 100,14 84,26" fill="#FFB347" />
        </svg>
    </div>

    <!-- Click-through toggle script: mouseenter/mouseleave -->
    <script>
        // Toggle click-through via CSS hover and communicate with Rust backend
        // When mouse enters the pet area, make it interactive
        // When mouse leaves, restore click-through

        const container = document.getElementById('pet-container');

        // Track whether mouse is over the pet window
        let mouseInside = false;

        container.addEventListener('mouseenter', () => {
            mouseInside = true;
            container.classList.add('interactive');
            console.log('Mouse entered pet — interactive mode ON');
        });

        container.addEventListener('mouseleave', () => {
            mouseInside = false;
            container.classList.remove('interactive');
            console.log('Mouse left pet — interactive mode OFF');
        });

        // Detect when mouse leaves the entire window
        document.addEventListener('mouseleave', () => {
            if (mouseInside) {
                mouseInside = false;
                container.classList.remove('interactive');
            }
        });
    </script>

    <script type="module" src="/src/main.ts"></script>
</body>
</html>
