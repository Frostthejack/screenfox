<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ScreenFox Settings</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
            color: #e0e0e0;
        }

        .settings-container {
            padding: 24px;
            max-width: 480px;
            margin: 0 auto;
        }

        h1 {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 4px;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .subtitle {
            font-size: 13px;
            color: #888;
            margin-bottom: 24px;
        }

        .setting-group {
            margin-bottom: 20px;
        }

        .setting-label {
            font-size: 13px;
            font-weight: 500;
            color: #aaa;
            margin-bottom: 8px;
            display: block;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .radio-group {
            display: flex;
            gap: 8px;
        }

        .radio-option {
            flex: 1;
        }

        .radio-option input[type="radio"] {
            display: none;
        }

        .radio-option label {
            display: block;
            padding: 10px 16px;
            text-align: center;
            background: #16213e;
            border: 2px solid #0f3460;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.15s ease;
            color: #ccc;
        }

        .radio-option label:hover {
            border-color: #e94560;
            color: #fff;
        }

        .radio-option input[type="radio"]:checked + label {
            background: #0f3460;
            border-color: #e94560;
            color: #fff;
            font-weight: 500;
        }

        .toggle-group {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            background: #16213e;
            border: 2px solid #0f3460;
            border-radius: 8px;
        }

        .toggle-label {
            font-size: 14px;
            color: #ccc;
        }

        .toggle-switch {
            position: relative;
            width: 44px;
            height: 24px;
        }

        .toggle-switch input {
            display: none;
        }

        .toggle-slider {
            position: absolute;
            inset: 0;
            background: #333;
            border-radius: 12px;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        .toggle-slider::before {
            content: '';
            position: absolute;
            width: 18px;
            height: 18px;
            left: 3px;
            bottom: 3px;
            background: #fff;
            border-radius: 50%;
            transition: transform 0.2s ease;
        }

        .toggle-switch input:checked + .toggle-slider {
            background: #e94560;
        }

        .toggle-switch input:checked + .toggle-slider::before {
            transform: translateX(20px);
        }

        .divider {
            height: 1px;
            background: #0f3460;
            margin: 20px 0;
        }

        .footer {
            margin-top: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .status {
            font-size: 12px;
            color: #666;
        }

        .status.saved {
            color: #4ecca3;
        }

        .reset-btn {
            padding: 8px 16px;
            background: transparent;
            border: 1px solid #0f3460;
            border-radius: 6px;
            color: #888;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .reset-btn:hover {
            border-color: #e94560;
            color: #e94560;
        }
    </style>
</head>
<body>
    <div class="settings-container">
        <h1>
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#FF8C00" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="3"/>
                <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
            </svg>
            ScreenFox Settings
        </h1>
        <p class="subtitle">Customize your desktop fox pet</p>

        <div class="setting-group">
            <span class="setting-label">Pet Size</span>
            <div class="radio-group">
                <div class="radio-option">
                    <input type="radio" name="petSize" id="sizeSmall" value="small">
                    <label for="sizeSmall">Small</label>
                </div>
                <div class="radio-option">
                    <input type="radio" name="petSize" id="sizeMedium" value="medium">
                    <label for="sizeMedium">Medium</label>
                </div>
                <div class="radio-option">
                    <input type="radio" name="petSize" id="sizeLarge" value="large">
                    <label for="sizeLarge">Large</label>
                </div>
            </div>
        </div>

        <div class="setting-group">
            <span class="setting-label">Movement Speed</span>
            <div class="radio-group">
                <div class="radio-option">
                    <input type="radio" name="moveSpeed" id="speedSlow" value="slow">
                    <label for="speedSlow">Slow</label>
                </div>
                <div class="radio-option">
                    <input type="radio" name="moveSpeed" id="speedMedium" value="medium">
                    <label for="speedMedium">Medium</label>
                </div>
                <div class="radio-option">
                    <input type="radio" name="moveSpeed" id="speedFast" value="fast">
                    <label for="speedFast">Fast</label>
                </div>
            </div>
        </div>

        <div class="setting-group">
            <span class="setting-label">Follow Distance</span>
            <div class="radio-group">
                <div class="radio-option">
                    <input type="radio" name="followDist" id="distClose" value="close">
                    <label for="distClose">Close</label>
                </div>
                <div class="radio-option">
                    <input type="radio" name="followDist" id="distMedium" value="medium">
                    <label for="distMedium">Medium</label>
                </div>
                <div class="radio-option">
                    <input type="radio" name="followDist" id="distFar" value="far">
                    <label for="distFar">Far</label>
                </div>
            </div>
        </div>

        <div class="divider"></div>

        <div class="setting-group">
            <div class="toggle-group">
                <span class="toggle-label">Sound Effects</span>
                <div class="toggle-switch">
                    <input type="checkbox" id="soundEffects">
                    <div class="toggle-slider"></div>
                </div>
            </div>
        </div>

        <div class="footer">
            <span class="status" id="status">Settings auto-saved</span>
            <button class="reset-btn" id="resetBtn">Reset to Defaults</button>
        </div>
    </div>

    <script type="module" src="/src/settings.ts"></script>
</body>
</html>
