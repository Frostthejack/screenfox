<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ScreenFox</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: transparent;
            pointer-events: none;
        }
        
        #pet-container {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: auto;
            cursor: grab;
        }
        
        #pet-container:active {
            cursor: grabbing;
        }
        
        #fox {
            width: 128px;
            height: 128px;
            transition: transform 0.1s ease;
        }
    </style>
</head>
<body>
    <div id="pet-container">
        <svg id="fox" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
            <!-- Placeholder fox shape — will be replaced by agent CLIs -->
            <circle cx="64" cy="64" r="48" fill="#FF8C00" />
            <circle cx="44" cy="52" r="8" fill="white" />
            <circle cx="84" cy="52" r="8" fill="white" />
            <circle cx="44" cy="52" r="4" fill="black" />
            <circle cx="84" cy="52" r="4" fill="black" />
            <ellipse cx="64" cy="72" rx="6" ry="4" fill="#333" />
            <!-- Ears -->
            <polygon points="32,32 24,8 48,28" fill="#FF8C00" />
            <polygon points="96,32 104,8 80,28" fill="#FF8C00" />
            <polygon points="34,28 28,14 44,26" fill="#FFB347" />
            <polygon points="94,28 100,14 84,26" fill="#FFB347" />
        </svg>
    </div>
    <script type="module" src="/src/main.ts"></script>
</body>
</html>
